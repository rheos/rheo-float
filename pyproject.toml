[project]
name = "rheo-finance"
version = "0.1.0"
description = "Float: a local-first personal finance ledger on Postgres."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pydantic>=2",
    # Pinned to the merge commit that packaged `docextract` (rheos/doc-extraction-api).
    # The repo is private: resolving it needs a GitHub read credential.
    "doc-extraction-api @ git+https://github.com/rheos/doc-extraction-api@0ad7253f6586eea62cabc32d7d69823e3987e67b",
]

[project.scripts]
finance = "rheo_finance.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_finance"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
