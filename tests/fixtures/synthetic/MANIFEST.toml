# Every file under tests/fixtures/synthetic/ is listed here, or the repo check fails (FR-45).
# Paths are relative to the repo root. Every value in a fixture is fake: digit runs of 8 or
# more start with 999, except YYYYMMDD dates and 13-digit millisecond epochs.
# Fractional digit runs count too: an 8-decimal quantity like 0.99912345 needs the 999
# prefix after the point.
# Fixtures are text (layout text, CSV, JSON), never binary: a data file holding NUL
# bytes that is not UTF-16 or UTF-32 fails the check as unscannable.

[[fixture]]
path = "tests/fixtures/synthetic/statement_layout.txt"
synthetic = true
description = "Tiny bank statement layout with fake values, so the check has a fixture to pass."

[[fixture]]
path = "tests/fixtures/synthetic/vancity_statement_2020.txt"
synthetic = true
description = "Vancity statement layout text (pdftotext -layout), older chequing name, a nicknamed (SIDE FUND) account closed in the period, a two-page account; fake values."

[[fixture]]
path = "tests/fixtures/synthetic/vancity_statement_2026.txt"
synthetic = true
description = "Vancity statement layout text, the same chequing number under its later name, an overdrawn spell and three fee types; fake values."

[[fixture]]
path = "tests/fixtures/synthetic/vancity_statement_split.txt"
synthetic = true
description = "Vancity statement layout text, one chequing account with a printed line holding a withdrawal, a deposit and the balance; fake values."

[[fixture]]
path = "tests/fixtures/synthetic/vancity_chequing_jump.csv"
synthetic = true
description = "Headerless Vancity chequing CSV export, newest first, one fake account identifier, with a deliberate running-balance jump (rows missing between two dates); fake values."

[[fixture]]
path = "tests/fixtures/synthetic/virgin_bill.txt"
synthetic = true
description = "Virgin Plus bill layout text (pdftotext -layout) whose unpaid balance plus current charges equals the total due; fake values."

